<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SleepSense — Sign up</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-page">
<div class="auth-shell">
  <div class="brand-mark">S</div>
  <h1>Create your account.</h1>
  <p class="muted">Set up your personal SleepSense profile.</p>
  <div class="error" th:if="${error != null && !error.isEmpty()}" th:text="${error}"></div>

  <form method="post" action="/signup" class="form">
    <input type="hidden"
       th:name="${_csrf.parameterName}"
       th:value="${_csrf.token}">
    <label>Full name<input type="text" name="fullName" required></label>
    <label>Email<input type="email" name="email" required></label>
    <label>Age<input type="number" name="age" min="1" max="120" required></label>
    <label>Password<input type="password" name="password" minlength="8" required></label>
    <label>Confirm password<input type="password" name="confirmPassword" minlength="8" required></label>
    <button class="primary full" type="submit">Create account</button>
  </form>

  <p class="centered small">Already have an account? <a href="/login">Sign in</a></p>
</div>
</body>
</html>
