<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1118">
  <title>SleepSense — Sign in</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-brand" href="/login" aria-label="SleepSense sign in">
      <span class="brand-symbol" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M21.9 5.6a11.3 11.3 0 1 0 4.5 20.8A12.7 12.7 0 0 1 21.9 5.6Z"/><path d="M21.5 7.1v5.2m-2.6-2.6h5.2"/></svg></span>
      <span class="brand-name">sleep<span>sense</span></span>
    </a>
    <h1>Welcome back</h1>
    <p>Sign in to review your latest sleep session.</p>
    <div class="notice" role="status" th:if="${param.registered}">Account created. You can now sign in.</div>
    <div class="error" role="alert" th:if="${param.error}">Email or password wasn’t recognized. Try again.</div>
    <div class="notice" role="status" th:if="${param.logout}">You have been logged out.</div>
    <form method="post" action="/login" class="form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <label>Email address<input type="email" name="username" placeholder="you@example.com" autocomplete="email" required></label>
      <label>Password<input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required></label>
      <button class="button button-primary full" type="submit">Sign in</button>
    </form>
    <div class="divider"><span>or</span></div>
    <a class="auth-link" href="/signup">Create an account</a>
    <p class="auth-note">SleepSense is a software prototype. Wearable readings are simulated.</p>
  </main>
</body>
</html>
