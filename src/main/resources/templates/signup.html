<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1118">
  <title>SleepSense — Create account</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-brand" href="/login" aria-label="SleepSense sign in">
      <span class="brand-symbol" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M21.9 5.6a11.3 11.3 0 1 0 4.5 20.8A12.7 12.7 0 0 1 21.9 5.6Z"/><path d="M21.5 7.1v5.2m-2.6-2.6h5.2"/></svg></span>
      <span class="brand-name">sleep<span>sense</span></span>
    </a>
    <h1>Create your account</h1>
    <p>Set up your personal SleepSense profile.</p>
    <div class="error" role="alert" th:if="${error != null && !error.isEmpty()}" th:text="${error}"></div>
    <form method="post" action="/signup" class="form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <label>Full name<input type="text" name="fullName" autocomplete="name" required></label>
      <label>Email address<input type="email" name="email" autocomplete="email" required></label>
      <label>Age<input type="number" name="age" min="1" max="120" inputmode="numeric" required></label>
      <label>Password<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
      <label>Confirm password<input type="password" name="confirmPassword" minlength="8" autocomplete="new-password" required></label>
      <button class="button button-primary full" type="submit">Create account</button>
    </form>
    <p class="auth-footer">Already have an account? <a href="/login">Sign in</a></p>
    <p class="auth-note">SleepSense is a software prototype. Wearable readings are simulated.</p>
  </main>
</body>
</html>
