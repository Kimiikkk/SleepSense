spring.application.name=SleepSense
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

firebase.enabled=${FIREBASE_ENABLED:true}
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.web.api-key=${FIREBASE_WEB_API_KEY:}
firebase.web.auth-domain=${FIREBASE_AUTH_DOMAIN:}
firebase.web.app-id=${FIREBASE_APP_ID:}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

spring.thymeleaf.cache=false

# Explainable smart sleep score weights; components are renormalized over available metrics.
sleepsense.score.weight.duration=${SLEEPSENSE_SCORE_WEIGHT_DURATION:25}
sleepsense.score.weight.deep=${SLEEPSENSE_SCORE_WEIGHT_DEEP:15}
sleepsense.score.weight.rem=${SLEEPSENSE_SCORE_WEIGHT_REM:15}
sleepsense.score.weight.awake=${SLEEPSENSE_SCORE_WEIGHT_AWAKE:10}
sleepsense.score.weight.efficiency=${SLEEPSENSE_SCORE_WEIGHT_EFFICIENCY:15}
sleepsense.score.weight.consistency=${SLEEPSENSE_SCORE_WEIGHT_CONSISTENCY:10}
sleepsense.score.weight.heart-rate=${SLEEPSENSE_SCORE_WEIGHT_HEART_RATE:10}
sleepsense.score.max-with-missing-core=${SLEEPSENSE_SCORE_MAX_WITH_MISSING_CORE:84}
sleepsense.score.max-without-consistency=${SLEEPSENSE_SCORE_MAX_WITHOUT_CONSISTENCY:92}

# Optional server-side Sleep Coach provider. "none" keeps the rule-based assistant active.
ai.coach.provider=${AI_PROVIDER:none}
ai.coach.api-key=${AI_API_KEY:}
ai.coach.base-url=${AI_API_BASE_URL:https://api.openai.com/v1/responses}
ai.coach.model=${AI_MODEL:gpt-4.1-mini}
ai.coach.timeout-seconds=${AI_TIMEOUT_SECONDS:12}

logging.level.org.springframework.security=INFO
