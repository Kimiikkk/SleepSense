<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SleepSense — Login</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-page">
<div class="auth-shell">
  <div class="brand-mark">S</div>
  <h1>Welcome back.</h1>
  <p class="muted">Sign in to your SleepSense dashboard.</p>

  <div class="notice" th:if="${param.registered}">Account created. You can now sign in.</div>
  <div class="notice" th:if="${param.error}">Invalid email or password.</div>
  <div class="notice" th:if="${param.logout}">You have been logged out.</div>

  <form method="post" action="/login" class="form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label>Email<input type="email" name="username" placeholder="you@example.com" required></label>
    <label>Password<input type="password" name="password" placeholder="••••••••" required></label>
    <button class="primary full" type="submit">Sign in</button>
  </form>

  <div class="divider"><span>or</span></div>
  <a class="secondary full button" href="/signup">Create an account</a>

  <p class="small centered">Prototype uses simulated sensor data.</p>
</div>
</body>
</html>
